# .github/workflows/terraform-plan.yml
#
# Runs on every pull request targeting main.
# Authenticates to AWS via OIDC (no long-lived secrets), runs
# terraform plan, and posts the plan output as a PR comment.

name: Terraform Plan

on:
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_ROLE_ARN: arn:aws:iam::556311299687:role/github-actions-terraform
  AWS_REGION: us-east-1
  TF_VERSION: "1.9.8"
  TF_VAR_trainee_name: ${{ vars.TF_VAR_trainee_name }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}


      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-plan

      - name: Terraform fmt -check
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init

      - name: Terraform plan
        id: plan
        run: |
          terraform plan -no-color -input=false -out=tfplan 2>&1 | tee plan_output.txt
          echo "exitcode=$?" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Post plan as PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('plan_output.txt', 'utf8');
            const maxLen = 60000;
            const body =  plan.length > maxLen
              ? plan.slice(0, maxLen) + '\n\n... (truncated)'
              : plan;
            const header = `### Terraform Plan\n\n<details><summary>Show plan</summary>\n\n\`\`\`terraform\n`;
            const footer = `\n\`\`\`\n\n</details>`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: header + body + footer
            });

      - name: Fail if plan failed
        if: steps.plan.outputs.exitcode != '0'
        run: |
          echo "Terraform plan failed. See logs above."
          exit 1