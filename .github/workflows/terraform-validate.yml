# .github/workflows/terraform-validate.yml
#
# Runs on every push to main and every pull request.
# Validates Terraform formatting and syntax - no AWS access needed.
#
# - terraform fmt -check: enforces canonical formatting
# - terraform validate:   checks syntax + internal references
#
# This is the "fast feedback" workflow. It runs in ~30 seconds and
# catches the vast majority of mistakes before they reach code review.

name: Terraform Validate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Cancel any in-progress run for the same branch/PR when a new push comes in.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Format + Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform fmt -check
        run: terraform fmt -check -recursive

      - name: Terraform init (root, no backend)
        run: terraform init -backend=false

      - name: Terraform validate (root)
        run: terraform validate

      - name: Terraform init (bootstrap, no backend)
        working-directory: bootstrap
        run: terraform init -backend=false

      - name: Terraform validate (bootstrap)
        working-directory: bootstrap
        run: terraform validate
